<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories — PetalTalk</title>
  <meta name="description" content="Browse all 20 PetalTalk English categories with progress and difficulty ranges.">
  <meta name="theme-color" content="#8ABDE3">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="categories">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="siteHeader"></header>
  <main id="main" class="page">
    <section class="wrap">
      <div class="page-head">
        <div><span class="eyebrow">Learning categories</span><h1>Twenty corners of the garden</h1><p id="catIntro"></p></div>
        <span id="catMimo"></span>
      </div>
      <div class="row row--between mb-3">
        <div class="search" style="flex:1;max-width:360px"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input type="search" id="catSearch" placeholder="Search categories…" aria-label="Search categories"></div>
        <label class="row small muted">Sort by <select id="catSort" class="cat-select" style="width:auto;padding-right:36px"><option value="default">Curriculum order</option><option value="favorites">Favorites first</option><option value="progress">Most explored</option><option value="weakest">Needs practice</option></select></label>
      </div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="paper paper--soft paper--pad mt-4 row row--between">
        <div><b>Can't decide?</b><div class="muted small">Let Mimo pick a mix from every category.</div></div>
        <a class="btn btn--primary" href="practice.html?mode=mixed&count=20&start=1">Mixed quiz, 20 questions</a>
      </div>
    </section>
    <script>document.addEventListener("DOMContentLoaded",function(){document.getElementById("catMimo").innerHTML=PT.mimo("think",{className:"head-mimo bob"});});</script>
  </main>
  <footer class="site-footer" id="siteFooter"></footer>
  <script src="data/questions.js"></script>
  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/randomizer.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/home.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/library.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
